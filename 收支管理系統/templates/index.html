<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人收支管理 | Finance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐟 個人收支管理</h1>
            <div class="month-selector">
                <label for="currentMonth">選擇月份：</label>
                <input type="month" id="currentMonth">
            </div>
        </header>

        <!-- 統計與預算卡片 -->
        <div class="card">
            <div class="dashboard-grid">
                <div class="stat-box">
                    <h3>總收入</h3>
                    <div class="amount income" id="totalIncome">$0</div>
                </div>
                <div class="stat-box">
                    <h3>總支出</h3>
                    <div class="amount expense" id="totalExpense">$0</div>
                </div>
                <div class="stat-box">
                    <h3>本月結餘</h3>
                    <div class="amount" id="totalBalance">$0</div>
                </div>
            </div>

            <div class="budget-container">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="budgetStatus">本月預算：$0</span>
                    <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="promptSetBudget()">設定預算</button>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="budgetProgress"></div>
                </div>
                <div class="alert-banner" id="overBudgetAlert">
                    ⚠️ 警告：當月支出已超出預算上限！
                </div>
            </div>
        </div>

        <!-- 圖表分析 -->
        <div class="card">
            <h2 style="font-size: 1.1rem; margin-top: 0;">📊 支出統計圖表</h2>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- 新增紀錄表單 -->
        <div class="card">
            <h2 style="font-size: 1.1rem; margin-top: 0;">✏️ 新增收支紀錄</h2>
            <form id="recordForm" class="form-group">
                <select id="type" required>
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
                <input type="text" id="category" placeholder="類別 (例: 飲食、薪水)" required style="width: 130px;">
                <input type="number" id="amount" placeholder="金額" required style="width: 100px;" min="0" step="0.1">
                <input type="date" id="date" required>
                <input type="text" id="note" placeholder="備註 (選填)" style="flex: 1; min-width: 120px;">
                <button type="submit" class="btn">加入</button>
            </form>
        </div>

        <!-- 明細列表 -->
        <div class="card">
            <h2 style="font-size: 1.1rem; margin-top: 0;">📋 當月收支明細</h2>
            <ul class="record-list" id="recordList"></ul>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
